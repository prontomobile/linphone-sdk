name: Build Linphone SDK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build yasm nasm doxygen python3-pip
          pip3 install pystache six --break-system-packages

      - name: Set up Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Configure CMake (Android)
        run: |
          cmake --preset=android-sdk -B build-android \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_VIDEO=OFF \
            -DENABLE_DOC=OFF \
            -DENABLE_NON_FREE_FEATURES=ON \
            -DENABLE_AMRWB=ON

      - name: Build SDK (Android)
        run: cmake --build build-android --parallel

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: linphone-sdk-android
          path: build-android/linphone-sdk/bin/outputs/aar/linphone-sdk-android-release.aar

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake ninja yasm nasm doxygen python3
          pip3 install pystache six --break-system-packages

      - name: Configure CMake (iOS)
        run: |
          cmake --preset=ios-sdk -G Ninja -B build-ios \
            -DENABLE_VIDEO=OFF \
            -DENABLE_DOC=OFF \
            -DENABLE_NON_FREE_FEATURES=ON \
            -DENABLE_AMRWB=ON

      - name: Build SDK (iOS)
        run: cmake --build build-ios

      - name: Upload iOS XCFrameworks
        uses: actions/upload-artifact@v4
        with:
          name: linphone-sdk-ios
          path: build-ios/linphone-sdk-novideo/apple-darwin/XCFrameworks/
